# Serves the static export and proxies /api/* to the Express API, so the
# browser talks to one origin (no CORS) and only nginx is published.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # Security headers on every response (nested locations below do not use
  # add_header, so they inherit these).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  # For the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One id per request, logged by nginx and by the API.
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # When the API cannot be reached at all, answer in the API's own error
    # shape (JSON) instead of nginx's HTML page. The API's own error responses
    # (e.g. its 503 when the database is down) pass through untouched.
    error_page 502 504 = @api_unreachable;
  }

  location @api_unreachable {
    default_type application/json;
    return 503 '{"error":"The API is not reachable right now. Try again in a moment."}';
  }

  # Hashed build assets never change: cache them for a year.
  location /_next/static/ {
    expires 1y;
  }

  # Pages: always revalidate, so a new deploy is picked up at once.
  location / {
    expires -1;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
